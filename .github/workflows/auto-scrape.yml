name: Auto Scrape KinoMM Movies

on:
  schedule:
    - cron: '0 0,18 * * *' # တစ်ရက် ၂ ကြိမ် (UTC 00:00 နဲ့ 18:00)
  workflow_dispatch: # လက်ဖြင့်လည်း Run လို့ရအောင်

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add clean_movies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Fetched new movies data" && git push)